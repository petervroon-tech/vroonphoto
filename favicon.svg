<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <!-- Camera body outline -->
  <rect x="12" y="24" width="76" height="58" rx="14" fill="#090d16" stroke="url(#ringGrad)" stroke-width="2.5" />
  <path d="M34 24 L38 16 L62 16 L66 24 Z" fill="#090d16" stroke="url(#ringGrad)" stroke-width="2" />
  <!-- Shutter button & red status dot -->
  <circle cx="28" cy="19" r="3" fill="#ef4444" />
  <rect x="68" y="18" width="8" height="4" rx="2" fill="#38bdf8" />
  <!-- Big Glass Lens -->
  <circle cx="50" cy="53" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <circle cx="50" cy="53" r="18" fill="url(#lensGlow)" />
  <!-- Aperture blades reflection -->
  <circle cx="45" cy="48" r="5" fill="#ffffff" opacity="0.75" />
  <circle cx="56" cy="59" r="2.5" fill="#ffffff" opacity="0.5" />
</svg>

